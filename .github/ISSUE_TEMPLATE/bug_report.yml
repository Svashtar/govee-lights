name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! Please check [Troubleshooting](https://github.com/svashtar/govee-lights/blob/main/docs/troubleshooting.md) and existing issues first.

        **Never paste your API key.** The debug info below doesn't contain it.
  - type: textarea
    id: debug-info
    attributes:
      label: Debug info
      description: Open the extension's settings → **About** → **Copy Debug Info**, then paste it here. It contains versions and light models, never your API key, device IDs or IP addresses.
      render: text
      placeholder: |
        Govee Lights: 0.1.0
        GNOME Shell: 50.5
        ...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Quick Settings tile for my desk lamp
        2. Drag the brightness slider
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Screenshots are welcome.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      description: How are the affected lights controlled? The light's menu footer and the Devices page show LAN or Cloud.
      options:
        - LAN
        - Cloud
        - Both / not sure
  - type: input
    id: sku
    attributes:
      label: Affected light model(s)
      description: The SKU, for example H6008. Leave empty if it isn't light-specific.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Shell log: run `journalctl -f -o cat /usr/bin/gnome-shell`, reproduce the problem, then paste the lines around it.
        Preferences window problems: `journalctl -f -o cat /usr/bin/gjs`.
        See [Collecting logs](https://github.com/svashtar/govee-lights/blob/main/docs/troubleshooting.md#collecting-logs).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I removed any private information (API key, IP addresses) from what I pasted.
          required: true
