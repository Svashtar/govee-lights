name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ESLint
        run: npx --yes eslint@9 .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gjs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin gir1.2-soup-3.0 gir1.2-secret-1
      - name: Run tests
        run: make test

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gnome-extensions and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gettext libglib2.0-bin
      - name: Build zip
        run: make pack
      - uses: actions/upload-artifact@v5
        with:
          name: govee-lights-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
